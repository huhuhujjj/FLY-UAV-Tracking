<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">虚构的无人机俯视道路示意</title>
  <desc id="desc">路口、建筑和车辆的俯视矢量插图，叠加了三个检测框与两条示意轨迹。</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#657b68"/>
      <stop offset="1" stop-color="#435c52"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#414b4a"/>
      <stop offset="1" stop-color="#343e3e"/>
    </linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1.2" fill="#d2cda7" opacity=".10"/>
      <circle cx="19" cy="20" r="1.5" fill="#172a2a" opacity=".12"/>
      <path d="M7 25 12 23M21 4l3 1" stroke="#d5d3b0" stroke-width="1" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#ground)"/>
  <rect width="1440" height="810" fill="url(#grain)"/>

  <!-- Blocks and rooftops create an aerial, not map-like, reading. -->
  <g opacity=".97">
    <path d="M0 0h405v190H0z" fill="#7c8874"/>
    <path d="M18 18h166v144H18z" fill="#9a9b82"/>
    <path d="M201 25h178v118H201z" fill="#858b78"/>
    <path d="M0 222h333v145H0z" fill="#738272"/>
    <path d="M22 241h132v105H22z" fill="#a5a48c"/>
    <path d="M181 239h128v103H181z" fill="#8d947e"/>
    <path d="M1082 0h358v215h-358z" fill="#687d6c"/>
    <path d="M1103 21h148v153h-148z" fill="#a3a18a"/>
    <path d="M1270 26h145v168h-145z" fill="#8d917d"/>
    <path d="M1120 256h320v170h-320z" fill="#71816f"/>
    <path d="M1142 278h126v123h-126z" fill="#a3a28b"/>
    <path d="M1288 278h127v123h-127z" fill="#92937d"/>
    <path d="M0 577h350v233H0z" fill="#71806c"/>
    <path d="M26 602h131v176H26z" fill="#969984"/>
    <path d="M179 604h145v174H179z" fill="#a5a28a"/>
    <path d="M1070 584h370v226h-370z" fill="#758570"/>
    <path d="M1095 605h135v174h-135z" fill="#a29f86"/>
    <path d="M1251 606h163v173h-163z" fill="#8d927b"/>
  </g>

  <!-- Small parking lots and trees. -->
  <g fill="#2d463d" opacity=".72">
    <circle cx="352" cy="90" r="22"/><circle cx="379" cy="161" r="17"/><circle cx="1057" cy="100" r="25"/>
    <circle cx="1056" cy="460" r="22"/><circle cx="374" cy="468" r="19"/><circle cx="343" cy="710" r="24"/>
    <circle cx="1083" cy="716" r="22"/><circle cx="1040" cy="535" r="15"/>
  </g>
  <g stroke="#d7d4b8" stroke-width="3" opacity=".45">
    <path d="M30 188h274M24 370h278M1134 224h276M1135 438h272M25 574h277M1110 573h296"/>
    <path d="M172 27v137M276 29v115M1180 28v144M1348 30v144M94 605v172M260 607v168M1164 608v168M1354 610v166"/>
  </g>

  <!-- Main crossing, road shoulders, lane markings. -->
  <path d="M421 -40 1030 -40 969 850 354 850Z" fill="#293736" opacity=".48"/>
  <path d="M438 -40 1008 -40 942 850 378 850Z" fill="url(#road)"/>
  <path d="M-80 378 1515 421 1515 644-80 596Z" fill="#293736" opacity=".48"/>
  <path d="M-80 393 1515 434 1515 626-80 580Z" fill="#3c4746"/>
  <path d="M421 -40 438 -40 378 850 359 850Z" fill="#b0aa8c" opacity=".65"/>
  <path d="M1008 -40 1027 -40 966 850 942 850Z" fill="#b0aa8c" opacity=".65"/>
  <path d="m-80 389 1595 43v8L-80 398zM-80 572l1595 44v8L-80 580z" fill="#b0aa8c" opacity=".65"/>
  <g stroke="#d7d4b9" stroke-width="5" stroke-dasharray="31 25" opacity=".78">
    <path d="M715 -20 651 850"/>
    <path d="M828 -20 772 850"/>
    <path d="M-30 448 1440 487"/>
    <path d="M-30 530 1440 571"/>
  </g>
  <g fill="#d8d5b9" opacity=".74">
    <path d="m584 205 19-21 17 23-12-3-2 26-11-1 2-26z"/>
    <path d="m902 657 19-21 17 23-12-3-2 26-11-1 2-26z"/>
    <path d="m250 474 21-18-2 13 32 1v11l-32-1 1 12z"/>
    <path d="m1182 505 21-18-2 13 32 1v11l-32-1 1 12z"/>
  </g>

  <!-- Vehicles; shadows are intentionally soft to suggest a rendered sample frame. -->
  <g filter="url(#shadow)">
    <g transform="translate(682 264) rotate(4)">
      <rect x="-34" y="-70" width="68" height="140" rx="18" fill="#d8d4c2"/>
      <rect x="-25" y="-37" width="50" height="50" rx="8" fill="#697d7b"/>
      <rect x="-25" y="22" width="50" height="25" rx="6" fill="#aeb3a5"/>
      <path d="M-27-53h9M18-53h9M-27 53h9M18 53h9" stroke="#242e2d" stroke-width="8" stroke-linecap="round"/>
      <rect x="-20" y="-62" width="12" height="5" rx="2" fill="#f6dd8d"/><rect x="8" y="-62" width="12" height="5" rx="2" fill="#f6dd8d"/>
    </g>
    <g transform="translate(823 520) rotate(3)">
      <rect x="-43" y="-77" width="86" height="154" rx="18" fill="#e3e0d0"/>
      <rect x="-32" y="-43" width="64" height="57" rx="8" fill="#71817d"/>
      <rect x="-31" y="22" width="62" height="37" rx="7" fill="#c4c4b2"/>
      <path d="M-36-61h10M26-61h10M-36 63h10M26 63h10" stroke="#252f2e" stroke-width="9" stroke-linecap="round"/>
      <rect x="-27" y="-69" width="15" height="5" rx="2" fill="#f4d789"/><rect x="12" y="-69" width="15" height="5" rx="2" fill="#f4d789"/>
    </g>
    <g transform="translate(1080 520) rotate(92)">
      <rect x="-25" y="-49" width="50" height="98" rx="13" fill="#c5d1cb"/>
      <rect x="-19" y="-24" width="38" height="34" rx="6" fill="#718782"/>
      <path d="M-22-40h7M15-40h7M-22 40h7M15 40h7" stroke="#252f2e" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Example trajectories and detection boxes. -->
  <path d="M664 315c-12 57-17 98-23 153" fill="none" stroke="#4fc2b0" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity=".92"/>
  <path d="M810 591c-8 54-10 105-19 162" fill="none" stroke="#e4b25e" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity=".95"/>
  <g fill="none" stroke-width="3">
    <rect x="634" y="191" width="96" height="183" rx="3" stroke="#4fc2b0"/>
    <rect x="754" y="425" width="138" height="193" rx="3" stroke="#e4b25e"/>
    <rect x="1010" y="478" width="141" height="82" rx="3" stroke="#83b4d3"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="600">
    <path d="M634 191h92v29h-92z" fill="#167f7b"/><text x="645" y="211" fill="#fff">车辆 018 · 汽车</text>
    <path d="M754 425h95v29h-95z" fill="#a9752e"/><text x="765" y="445" fill="#fff">车辆 022 · 巴士</text>
    <path d="M1010 478h95v29h-95z" fill="#557892"/><text x="1021" y="498" fill="#fff">车辆 024 · 汽车</text>
  </g>

  <!-- Camera framing guides. -->
  <rect x="20" y="20" width="1400" height="770" rx="3" fill="none" stroke="#f0f3e9" stroke-opacity=".18" stroke-width="2"/>
</svg>
